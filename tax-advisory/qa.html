<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>QA viewport</title>
<style>
  html,body{margin:0;padding:0;background:#3a3a3a}
  iframe{display:block;border:0;background:#fff}
  #err{position:fixed;right:0;bottom:0;background:#900;color:#fff;font:12px monospace;padding:6px;z-index:9;display:none;white-space:pre-wrap;max-width:50%}
</style></head>
<body>
<iframe id="f" src="index.html"></iframe>
<div id="err"></div>
<script>
  var q = new URLSearchParams(location.search);
  var p = q.get('p') || 'index.html';
  var w = q.get('w') || 'pc';
  var f = document.getElementById('f');
  f.style.width = w === 'mo' ? '390px' : '1280px';
  f.style.height = w === 'mo' ? '844px' : '800px';
  var v = q.get('v') || Date.now();
  f.src = p + '?v=' + v;
  f.onload = function () {
    try {
      var win = f.contentWindow;
      window.__errors = [];
      win.addEventListener('error', function (e) { window.__errors.push(String(e.message)); });
    } catch (e) {}
  };
</script>
</body></html>
