<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>QA run</title>
<style>body{margin:0;background:#111;color:#ddd;font:12px/1.5 monospace}pre{padding:10px;white-space:pre-wrap}iframe{position:absolute;left:-9999px;top:0;border:0}</style>
</head><body>
<pre id="out">running…</pre>
<script>
const pages = ['index.html','about.html','team.html','contact.html','tax.html','consulting.html','cases.html','calculator.html','insights.html','faq.html'];
const v = Date.now();
const wait = ms => new Promise(r => setTimeout(r, ms));
function run(src, w, h) {
  return new Promise(res => {
    const f = document.createElement('iframe');
    f.style.width = w + 'px'; f.style.height = h + 'px';
    f.src = src + '?v=' + v;
    const errs = [];
    f.onload = async () => {
      const win = f.contentWindow, d = f.contentDocument;
      win.addEventListener('error', e => errs.push(String(e.message)));
      await wait(700);
      // scroll through the page to trigger lazy images and reveals
      const H = d.documentElement.scrollHeight;
      for (let y = 0; y < H; y += h) { win.scrollTo(0, y); await wait(130); }
      win.scrollTo(0, 0); await wait(900);
      const imgs = [...d.images].map(i => ({src: i.getAttribute('src'), ok: i.complete && i.naturalWidth > 0}));
      const out = {
        page: src, width: w,
        scrollW: d.documentElement.scrollWidth, clientW: d.documentElement.clientWidth,
        overflow: d.documentElement.scrollWidth > d.documentElement.clientWidth + 1,
        broken: imgs.filter(i => !i.ok).map(i => i.src),
        imgs: imgs.length,
        docH: H,
        errors: errs,
        h1: (d.querySelector('h1') || {}).textContent,
        navLinks: d.querySelectorAll('.header .nav a').length,
        revealIn: d.querySelectorAll('.reveal.in').length,
        revealTotal: d.querySelectorAll('.reveal').length,
        counterSample: (d.querySelector('[data-count]') || {}).textContent
      };
      f.remove();
      res(out);
    };
    document.body.appendChild(f);
  });
}
(async () => {
  const results = [];
  for (const p of pages) {
    results.push(await run(p, 1280, 800));
    results.push(await run(p, 390, 844));
  }
  document.getElementById('out').textContent = JSON.stringify(results);
  window.__qa = results;
})();
</script>
</body></html>
