<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="robots" content="noindex, nofollow">
<meta name="googlebot" content="noindex, nofollow">
<meta name="color-scheme" content="light" />
<title>⚡ Kai의 게임 — 영웅 대결 (신화 × 포켓몬 × 어벤져스)</title>
<style>
  :root{
    --ink:#2C2A3C;
    --soft:#6B6880;
    --line:#E3E9F5;
    --shadow:0 12px 0 rgba(44,42,60,.07), 0 22px 44px rgba(44,42,60,.12);
    --gold:#FFC83D;
  }
  *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body{ height:100%; margin:0; }
  body{
    font-family:"Malgun Gothic","맑은 고딕","Apple SD Gothic Neo","Noto Sans KR","Segoe UI",system-ui,-apple-system,sans-serif;
    color:var(--ink);
    background:
      radial-gradient(1100px 620px at 8% -12%, #DFF1FF 0%, rgba(223,241,255,0) 62%),
      radial-gradient(900px 540px at 102% -4%, #FFF1D2 0%, rgba(255,241,210,0) 58%),
      radial-gradient(700px 500px at 50% 118%, #EAFBF1 0%, rgba(234,251,241,0) 62%),
      linear-gradient(180deg,#F4FAFF 0%, #FFFBF2 100%);
    overflow:hidden;
    user-select:none;
    -webkit-user-select:none;
  }
  #app{ position:fixed; inset:0; overflow:hidden; }

  /* ---------- background decorations ---------- */
  .bg-deco{ position:absolute; inset:0; pointer-events:none; overflow:hidden; z-index:0; }
  .bg-deco span{ position:absolute; opacity:.55; filter:saturate(.9); animation:drift 9s ease-in-out infinite; }
  .d1{ left:3%;  top:12%; font-size:clamp(24px,4.4vh,52px); animation-delay:0s; }
  .d2{ left:88%; top:22%; font-size:clamp(22px,4vh,46px); animation-delay:1.2s; }
  .d3{ left:7%;  top:78%; font-size:clamp(18px,3.2vh,36px); animation-delay:2.1s; }
  .d4{ left:92%; top:72%; font-size:clamp(18px,3.2vh,36px); animation-delay:.7s; }
  .d5{ left:74%; top:6%;  font-size:clamp(20px,3.6vh,40px); animation-delay:1.7s; }
  @keyframes drift{ 0%,100%{ transform:translateY(0) rotate(-3deg);} 50%{ transform:translateY(-16px) rotate(4deg);} }

  /* ---------- screens ---------- */
  .screen{
    position:absolute; inset:0; z-index:1; display:none; flex-direction:column;
    padding:1.6vh 1.8vw 1.8vh; gap:1.1vh; overflow:hidden;
  }
  .screen.active{ display:flex; animation:fadeIn .28s ease; }
  @keyframes fadeIn{ from{ opacity:0; transform:translateY(8px);} to{ opacity:1; transform:none;} }

  /* ---------- buttons ---------- */
  .icon-btn{
    font:inherit; font-weight:800; font-size:clamp(13px,1.9vh,18px);
    padding:.9vh 1vw; border-radius:999px; border:3px solid #E1E8F4; background:#fff;
    color:#4B4860; cursor:pointer; box-shadow:0 4px 0 #E4EAF4; white-space:nowrap;
    transition:transform .1s, box-shadow .1s, background .15s;
  }
  .icon-btn:hover{ background:#F7FAFF; }
  .icon-btn:active{ transform:translateY(3px); box-shadow:0 1px 0 #E4EAF4; }
  .big-btn{
    font:inherit; font-weight:900; font-size:clamp(20px,3.2vh,34px);
    padding:2vh 3.4vw; border-radius:999px; border:none; cursor:pointer; color:#fff;
    background:linear-gradient(180deg,#FFB93D,#FF8A2B);
    box-shadow:0 10px 0 #E06E1A, 0 18px 30px rgba(224,110,26,.35);
    transition:transform .12s, box-shadow .12s; letter-spacing:-.01em;
  }
  .big-btn:active{ transform:translateY(6px); box-shadow:0 4px 0 #E06E1A; }
  .big-btn.ghost{
    background:#fff; color:#5A5872; border:3px solid #E1E8F4;
    box-shadow:0 8px 0 #E6EBF5; font-size:clamp(16px,2.4vh,24px);
  }
  .big-btn.ghost:active{ box-shadow:0 2px 0 #E6EBF5; transform:translateY(5px); }

  /* ---------- top bar ---------- */
  .topbar{ display:flex; align-items:center; gap:.8vw; flex:0 0 auto; min-height:6.4vh; }
  .logo{
    font-size:clamp(14px,2.2vh,21px); font-weight:900; letter-spacing:-.02em;
    background:linear-gradient(90deg,#5B8CFF,#9D6BFF 45%,#FF7AA2 75%,#FFB03A);
    -webkit-background-clip:text; background-clip:text; color:transparent; white-space:nowrap;
  }
  .top-right{ display:flex; align-items:center; gap:.55vw; margin-left:auto; }
  .badge{
    font-size:clamp(12px,1.8vh,17px); font-weight:900; color:#8A5A00;
    background:linear-gradient(180deg,#FFF4CC,#FFE38F); border:2px solid #FFD25E;
    padding:.6vh .9vw; border-radius:999px; white-space:nowrap;
  }
  .turn-banner{
    flex:1; text-align:center; font-size:clamp(15px,2.3vh,26px); font-weight:900; color:#fff;
    background:linear-gradient(180deg,#7FB6FF,#5B8CFF); padding:.9vh 1vw; border-radius:999px;
    box-shadow:0 5px 0 #3F6FD8, inset 0 2px 0 rgba(255,255,255,.35);
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
  }
  .turn-banner.p1{ background:linear-gradient(180deg,#7FB6FF,#5B8CFF); box-shadow:0 5px 0 #3F6FD8; }
  .turn-banner.p2{ background:linear-gradient(180deg,#FF9EBE,#FF6F9E); box-shadow:0 5px 0 #D94B7A; }
  .turn-banner.ai{ background:linear-gradient(180deg,#C7B8FF,#9D86F2); box-shadow:0 5px 0 #7A61D6; }

  /* ---------- start screen ---------- */
  #screen-start{ justify-content:center; align-items:center; text-align:center; gap:0; }
  .start-top{ position:absolute; top:1.6vh; left:1.8vw; right:1.8vw; display:flex; align-items:center; }
  .start-top .badge{ margin-left:auto; }
  .start-main{ display:flex; flex-direction:column; align-items:center; gap:1.2vh; z-index:2; }
  h1.title{
    margin:0; font-size:clamp(44px,10.4vh,118px); line-height:.98; font-weight:900; letter-spacing:-.04em;
    background:linear-gradient(180deg,#6FA9FF 0%,#8F79FF 42%,#FF7FB0 74%,#FFC24B 100%);
    -webkit-background-clip:text; background-clip:text; color:transparent;
    filter:drop-shadow(0 6px 0 rgba(255,255,255,.9)) drop-shadow(0 14px 22px rgba(120,110,220,.25));
    animation:titlePop .7s cubic-bezier(.2,1.5,.5,1) both;
  }
  @keyframes titlePop{ from{ transform:scale(.82); opacity:0;} to{ transform:none; opacity:1;} }
  .subtitle{
    margin:0; font-size:clamp(15px,2.6vh,30px); font-weight:900; color:#5A5872; letter-spacing:-.01em;
  }
  .subtitle b{ color:#FF7A45; }
  .hero-row{ display:flex; align-items:flex-end; justify-content:center; gap:1.4vw; margin:1vh 0 .4vh; }
  .hero-row .peek{
    width:clamp(78px,15vh,168px); height:clamp(78px,15vh,168px);
    animation:peek 2.4s ease-in-out infinite;
  }
  .hero-row .peek:nth-child(2){ animation-delay:.35s; width:clamp(94px,18vh,200px); height:clamp(94px,18vh,200px); }
  .hero-row .peek:nth-child(3){ animation-delay:.7s; }
  .hero-row svg{ width:100%; height:100%; display:block; }
  @keyframes peek{ 0%,100%{ transform:translateY(0) rotate(-2deg);} 50%{ transform:translateY(-12px) rotate(2deg);} }
  .start-hint{ margin:1.2vh 0 0; font-size:clamp(13px,1.9vh,19px); font-weight:800; color:var(--soft); }
  .start-hint b{ color:#FF7A45; }

  /* ---------- setup ---------- */
  .setup-title{ font-size:clamp(17px,2.6vh,28px); font-weight:900; text-align:center; flex:1; }
  .mode-wrap{ flex:1; display:flex; align-items:center; justify-content:center; gap:2.4vw; padding:0 2vw; }
  .mode-card{
    font:inherit; color:var(--ink); cursor:pointer; text-align:center;
    flex:0 1 420px; padding:3.4vh 2vw; border-radius:34px; border:5px solid; background:#fff;
    box-shadow:var(--shadow); transition:transform .14s, box-shadow .14s;
    display:flex; flex-direction:column; align-items:center; gap:.7vh;
  }
  .mode-card.solo{ border-color:#FFD25E; background:linear-gradient(180deg,#FFFDF4,#FFF3CF); }
  .mode-card.duo{ border-color:#FFA9C6; background:linear-gradient(180deg,#FFF8FB,#FFE8F0); }
  .mode-card:hover{ transform:translateY(-6px); box-shadow:0 18px 0 rgba(44,42,60,.06), 0 28px 50px rgba(44,42,60,.16); }
  .mode-card:active{ transform:translateY(2px) scale(.99); }
  .mode-emoji{ font-size:clamp(46px,9vh,92px); line-height:1; }
  .mode-name{ font-size:clamp(22px,3.6vh,38px); font-weight:900; }
  .mode-desc{ font-size:clamp(14px,2.1vh,21px); font-weight:800; color:#6B6880; }
  .mode-sub{ font-size:clamp(12px,1.7vh,17px); font-weight:800; color:#9A97AC; }

  .pick-wrap{ flex:1; display:none; flex-direction:column; gap:1vh; min-height:0; }
  .pick-wrap.show{ display:flex; animation:fadeIn .25s ease; }
  .pick-hint{ margin:0; text-align:center; font-size:clamp(15px,2.3vh,24px); font-weight:900; color:#5A5872; flex:0 0 auto; }
  .pick-hint b{ color:#FF7A45; }
  .pick-grid{
    flex:1; min-height:0; display:grid; grid-template-columns:repeat(3,1fr); grid-template-rows:repeat(3,1fr);
    gap:1vh 1vw; padding:0 .6vw;
  }
  .pick-card{
    font:inherit; color:var(--ink); cursor:pointer; display:flex; align-items:center; gap:1vw;
    padding:.8vh 1vw; border-radius:26px; border:4px solid var(--line); background:#fff;
    box-shadow:0 7px 0 rgba(44,42,60,.06); transition:transform .12s, box-shadow .12s, border-color .12s, background .12s;
    overflow:hidden; text-align:left;
  }
  .pick-card:hover{ transform:translateY(-4px); border-color:#B9D4FF; box-shadow:0 12px 0 rgba(44,42,60,.07); }
  .pick-card:active{ transform:translateY(2px); }
  .pick-card.picked{ border-color:#FF9F1C; background:#FFF9E9; }
  .pick-art{ width:clamp(54px,10.5vh,110px); height:clamp(54px,10.5vh,110px); flex:0 0 auto; }
  .pick-art svg{ width:100%; height:100%; display:block; }
  .pick-txt{ display:flex; flex-direction:column; gap:.2vh; min-width:0; }
  .pick-name{ font-size:clamp(16px,2.5vh,29px); font-weight:900; letter-spacing:-.02em; white-space:nowrap; }
  .pick-tag{ font-size:clamp(11px,1.6vh,16px); font-weight:800; color:#8C8AA0; white-space:nowrap; }
  .pick-card.world-myth{ border-color:#FFE1B0; }
  .pick-card.world-poke{ border-color:#FFEFAF; }
  .pick-card.world-hero{ border-color:#FFD3D9; }
  .pick-card.world-myth:hover{ background:#FFFBEF; }
  .pick-card.world-poke:hover{ background:#FFFDF0; }
  .pick-card.world-hero:hover{ background:#FFF7F8; }
  .pick-card{ flex-direction:column; justify-content:center; gap:.2vh; padding:.5vh .5vw; text-align:center; }
  .pick-art{ width:clamp(62px,12.2vh,128px); height:clamp(62px,12.2vh,128px); }
  .pick-name{ font-size:clamp(17px,2.6vh,30px); text-align:center; }
  .pick-tag{ text-align:center; }
  .pick-txt{ align-items:center; }
  .pick-foot{ flex:0 0 auto; display:flex; justify-content:center; padding-top:.4vh; }

  /* ---------- battle ---------- */
  .stage{
    position:relative; flex:1 1 auto; min-height:0; display:flex; align-items:stretch; gap:.6vw;
    border-radius:34px; padding:1vh .8vw;
    background:
      radial-gradient(520px 240px at 22% 18%, rgba(255,255,255,.9), rgba(255,255,255,0) 70%),
      radial-gradient(520px 240px at 78% 18%, rgba(255,255,255,.85), rgba(255,255,255,0) 70%),
      linear-gradient(180deg, rgba(255,255,255,.9), rgba(240,246,255,.92));
    box-shadow:var(--shadow), inset 0 0 0 4px rgba(255,255,255,.7);
    overflow:hidden;
  }
  .stage.shake{ animation:stageShake .34s ease; }
  @keyframes stageShake{ 0%,100%{ transform:translate(0,0);} 20%{ transform:translate(-5px,2px);} 45%{ transform:translate(5px,-2px);} 70%{ transform:translate(-3px,1px);} }
  .fighter{
    position:relative; flex:1 1 0; min-width:0; display:flex; flex-direction:column; align-items:center;
    padding:.8vh .6vw; border-radius:28px; transition:background .25s;
  }
  .fighter.active-turn{ background:radial-gradient(circle at 50% 46%, rgba(255,238,170,.75), rgba(255,255,255,0) 68%); }
  .fighter.active-turn .avatar-box{ filter:drop-shadow(0 0 18px rgba(255,205,60,.55)); }
  .nameplate{ display:flex; align-items:center; gap:.6vw; flex:0 0 auto; font-weight:900; font-size:clamp(16px,2.6vh,30px); letter-spacing:-.02em; }
  .tag{ font-size:clamp(11px,1.55vh,15px); font-weight:900; padding:.35vh .7vw; border-radius:999px; }
  .tag.t0{ background:#E4F0FF; color:#2F6BD6; }
  .tag.t1{ background:#FFE8F0; color:#C94570; }
  .avatar-box{ position:relative; flex:1 1 auto; min-height:0; width:100%; display:flex; align-items:center; justify-content:center; }
  .avatar{ width:100%; height:100%; display:block; animation:idle 2.8s ease-in-out infinite; }
  .avatar svg{ width:100%; height:100%; display:block; }
  .fighter.right .avatar{ animation-delay:.5s; }
  @keyframes idle{ 0%,100%{ transform:translateY(0) rotate(-1deg);} 50%{ transform:translateY(-9px) rotate(1deg);} }
  .avatar.cast{ animation:castJump .45s ease; }
  @keyframes castJump{ 0%{ transform:translateY(0) scale(1);} 35%{ transform:translateY(-22px) scale(1.05);} 100%{ transform:translateY(0) scale(1);} }
  .avatar.hit{ animation:hitWobble .55s ease; }
  @keyframes hitWobble{ 0%{ transform:translate(0,0) rotate(0);} 20%{ transform:translate(-9px,4px) rotate(-5deg);} 45%{ transform:translate(8px,-3px) rotate(5deg);} 70%{ transform:translate(-5px,2px) rotate(-3deg);} 100%{ transform:translate(0,0) rotate(0);} }
  .sleep{ position:absolute; top:2%; right:10%; font-size:clamp(20px,4.2vh,44px); display:none; animation:zfloat 1.8s ease-in-out infinite; }
  .sleep.show{ display:block; }
  @keyframes zfloat{ 0%,100%{ transform:translateY(0) rotate(-6deg); opacity:.85;} 50%{ transform:translateY(-14px) rotate(6deg); opacity:1;} }
  .bars{ width:100%; flex:0 0 auto; display:flex; flex-direction:column; gap:.55vh; margin-top:.3vh; }
  .bar-row{ display:flex; align-items:center; gap:.5vw; }
  .bar-row .ico{ font-size:clamp(13px,1.9vh,21px); flex:0 0 auto; }
  .bar{
    position:relative; flex:1; height:clamp(17px,3.3vh,32px); border-radius:999px;
    background:#EBF0F8; overflow:hidden; box-shadow:inset 0 2px 5px rgba(30,35,60,.1);
  }
  .fill{ height:100%; border-radius:999px; transition:width .32s cubic-bezier(.3,1,.4,1); }
  .fill.hp{ background:linear-gradient(90deg, var(--c,#5AA9FF), var(--c2,#9FD8FF)); box-shadow:inset 0 -6px 0 rgba(0,0,0,.06); }
  .bar.low .fill.hp{ background:linear-gradient(90deg,#FF7B7B,#FFC46B); animation:lowPulse 1s ease-in-out infinite; }
  @keyframes lowPulse{ 0%,100%{ filter:brightness(1);} 50%{ filter:brightness(1.18);} }
  .fill.sp{ background:linear-gradient(90deg,#FFD24D,#FFA3D9); box-shadow:inset 0 -6px 0 rgba(0,0,0,.06); }
  .fill.sp.full{ background:linear-gradient(90deg,#FFD24D,#FF7AB8,#8F79FF); background-size:200% 100%; animation:spFlow 1.4s linear infinite; }
  @keyframes spFlow{ from{ background-position:0 0;} to{ background-position:200% 0;} }
  .bar-num{ position:absolute; inset:0; display:flex; align-items:center; justify-content:center; font-size:clamp(10px,1.6vh,15px); font-weight:900; color:#3E3B52; text-shadow:0 1px 0 rgba(255,255,255,.9); }
  .vs{
    flex:0 0 auto; align-self:center; font-size:clamp(18px,4vh,46px); font-weight:900; color:#CEDAEF;
    text-shadow:0 3px 0 #fff; transform:rotate(-6deg); letter-spacing:-.06em; padding:0 .2vw;
  }

  .msg{
    flex:0 0 auto; min-height:5.4vh; display:flex; align-items:center; justify-content:center; text-align:center;
    font-size:clamp(15px,2.35vh,27px); font-weight:900; color:#4B4860; padding:0 1.5vw; letter-spacing:-.02em;
  }
  .msg.pop{ animation:msgPop .36s cubic-bezier(.2,1.4,.5,1); }
  @keyframes msgPop{ 0%{ transform:scale(.9); opacity:.2;} 60%{ transform:scale(1.04);} 100%{ transform:scale(1); opacity:1;} }

  .skills{ flex:0 0 auto; height:25vh; min-height:132px; display:grid; grid-template-columns:repeat(3,1fr); gap:1.1vw; }
  .skill{
    position:relative; font:inherit; color:var(--ink); cursor:pointer; border-radius:30px;
    display:flex; flex-direction:column; align-items:center; justify-content:center; gap:.35vh;
    border:5px solid; box-shadow:0 9px 0 rgba(44,42,60,.1);
    transition:transform .1s, box-shadow .1s, filter .15s, opacity .15s; overflow:hidden;
  }
  .skill.basic{ border-color:#8CC4FF; background:linear-gradient(180deg,#F6FBFF,#E4F1FF); }
  .skill.special{ border-color:#FFC93D; background:linear-gradient(180deg,#FFFEF6,#FFF1CA); }
  .skill.defend{ border-color:#9DE2BE; background:linear-gradient(180deg,#F5FFFA,#E1F8EC); }
  .skill:disabled{ opacity:.42; filter:grayscale(.6) blur(.3px); cursor:default; }
  .skill:not(:disabled):hover{ transform:translateY(-3px); box-shadow:0 12px 0 rgba(44,42,60,.1); }
  .skill:not(:disabled):active{ transform:translateY(6px); box-shadow:0 3px 0 rgba(44,42,60,.1); }
  .sk-emoji{ font-size:clamp(30px,6.2vh,62px); line-height:1; filter:drop-shadow(0 4px 0 rgba(0,0,0,.08)); }
  .sk-name{ font-size:clamp(15px,2.45vh,28px); font-weight:900; letter-spacing:-.02em; text-align:center; padding:0 .4vw; }
  .sk-sub{ font-size:clamp(10.5px,1.55vh,16px); font-weight:800; color:#8A87A0; }
  .skill.special.ready{ animation:readyPulse 1.1s ease-in-out infinite; border-color:#FF9F1C; }
  @keyframes readyPulse{
    0%,100%{ box-shadow:0 9px 0 #FFD68A, 0 0 0 0 rgba(255,196,61,.55); transform:scale(1);}
    50%{ box-shadow:0 9px 0 #FFD68A, 0 0 34px 12px rgba(255,196,61,.38); transform:scale(1.025);}
  }
  .skill.special.ready .sk-sub{ color:#D97A00; }

  /* ---------- fx layer ---------- */
  #fx{ position:absolute; inset:0; pointer-events:none; overflow:hidden; border-radius:34px; z-index:6; }
  .projectile{ position:absolute; animation:shoot .48s linear forwards; will-change:transform; filter:drop-shadow(0 4px 6px rgba(0,0,0,.18)); }
  @keyframes shoot{
    0%{ transform:translate(-50%,-50%) scale(.25) rotate(0); opacity:0; }
    18%{ opacity:1; transform:translate(-50%,-50%) scale(1.1) rotate(20deg); }
    80%{ opacity:1; }
    100%{ transform:translate(calc(-50% + var(--tx)), calc(-50% + var(--ty))) scale(1.25) rotate(120deg); opacity:0; }
  }
  .spark{ position:absolute; transform:translate(-50%,-50%); animation:sparkPop .9s ease-out forwards; will-change:transform,opacity; }
  @keyframes sparkPop{
    0%{ opacity:0; transform:translate(-50%,-50%) scale(.2); }
    25%{ opacity:1; transform:translate(calc(-50% + var(--dx)*.45), calc(-50% + var(--dy)*.45)) scale(1.25) rotate(var(--r)); }
    100%{ opacity:0; transform:translate(calc(-50% + var(--dx)), calc(-50% + var(--dy)*1.2)) scale(.85) rotate(calc(var(--r)*2)); }
  }
  .ring{
    position:absolute; border-radius:50%; transform:translate(-50%,-50%); border:6px solid #fff;
    animation:ringOut .55s ease-out forwards; mix-blend-mode:screen;
  }
  .ring.big{ border-width:10px; animation:ringOut .8s ease-out forwards; }
  @keyframes ringOut{ 0%{ width:10px; height:10px; opacity:.95;} 100%{ width:260px; height:260px; opacity:0;} }
  .float-num{
    position:absolute; transform:translate(-50%,-50%); font-size:clamp(22px,4.2vh,44px); font-weight:900;
    color:#F0553F; text-shadow:0 3px 0 #fff, 0 0 14px rgba(255,255,255,.95); animation:floatUp 1.15s ease-out forwards;
  }
  .float-num.good{ color:#22A96B; }
  .float-num.combo{ color:#8F5BFF; font-size:clamp(16px,2.6vh,26px); }
  @keyframes floatUp{
    0%{ opacity:0; transform:translate(-50%,-20%) scale(.5);}
    22%{ opacity:1; transform:translate(-50%,-58%) scale(1.25);}
    100%{ opacity:0; transform:translate(-50%,-165%) scale(1);}
  }
  #flash{ position:absolute; inset:0; background:#fff; opacity:0; pointer-events:none; z-index:5; border-radius:34px; transition:opacity .3s ease; }
  #flash.on{ opacity:.55; transition:opacity .04s ease; }
  .special-banner{
    position:absolute; left:50%; top:44%; transform:translate(-50%,-50%) rotate(-4deg); z-index:8;
    font-size:clamp(34px,8vh,86px); font-weight:900; letter-spacing:-.05em; pointer-events:none;
    background:linear-gradient(180deg,#FFF3B0,#FFB03A 45%,#FF6FA5 100%);
    -webkit-background-clip:text; background-clip:text; color:transparent;
    -webkit-text-stroke:3px #fff; paint-order:stroke fill;
    filter:drop-shadow(0 8px 0 rgba(255,255,255,.85)) drop-shadow(0 14px 22px rgba(255,140,80,.5));
    animation:specialIn .95s cubic-bezier(.2,1.6,.4,1) forwards;
  }
  @keyframes specialIn{
    0%{ transform:translate(-50%,-50%) rotate(-18deg) scale(.3); opacity:0;}
    25%{ transform:translate(-50%,-50%) rotate(-4deg) scale(1.12); opacity:1;}

  var ORDER = ['zeus', 'poseidon', 'athena', 'pikachu', 'charizard', 'squirtle', 'ironman', 'spiderman', 'thor'];

  /* =========================================================
     sound (Web Audio, no external files)
  ========================================================= */
  var actx = null;
  var soundOn = true;

  function audio() {
    if (!actx) {
      var AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return null;
      try { actx = new AC(); } catch (e) { actx = null; }
    }
    if (actx && actx.state === 'suspended') { try { actx.resume(); } catch (e) {} }
    return actx;
  }

  function tone(freq, dur, type, vol, when, slideTo) {
    if (!soundOn) return;
    var ctx = audio();
    if (!ctx) return;
    var t0 = ctx.currentTime + (when || 0);
    var osc = ctx.createOscillator();
    var gain = ctx.createGain();
    osc.type = type || 'sine';
    osc.frequency.setValueAtTime(freq, t0);
    if (slideTo) osc.frequency.exponentialRampToValueAtTime(slideTo, t0 + dur);
    gain.gain.setValueAtTime(0.0001, t0);
    gain.gain.exponentialRampToValueAtTime(vol || 0.1, t0 + 0.02);
    gain.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    osc.connect(gain);
    gain.connect(ctx.destination);
    osc.start(t0);
    osc.stop(t0 + dur + 0.06);
  }

  function noiseBurst(dur, vol, when) {
    if (!soundOn) return;
    var ctx = audio();
    if (!ctx) return;
    var t0 = ctx.currentTime + (when || 0);
    var len = Math.floor(ctx.sampleRate * dur);
    var buf = ctx.createBuffer(1, len, ctx.sampleRate);
    var data = buf.getChannelData(0);
    for (var i = 0; i < len; i += 1) {
      data[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / len, 2.6);
    }
    var src = ctx.createBufferSource();
    src.buffer = buf;
    var filt = ctx.createBiquadFilter();
    filt.type = 'bandpass';
    filt.frequency.value = 1500;
    filt.Q.value = 0.9;
    var g = ctx.createGain();
    g.gain.value = vol || 0.07;
    src.connect(filt); filt.connect(g); g.connect(ctx.destination);
    src.start(t0);
  }

  var SFX = {

  function applySoundUI() {

  /* =========================================================

  function renderFighter(side) {
    var f = S.fighters[side];
    var c = CHARS[f.key];
    $('#name' + side).textContent = c.name;
    var tag = $('#tag' + side);
    tag.textContent = S.mode === 'duo' ? (side === 0 ? '1번' : '2번') : (side === 0 ? '나' : '컴퓨터');
    tag.className = 'tag t' + side;
    var av = $('#av' + side);
    av.innerHTML = paint(c.svg);
    av.classList.remove('hit');
    var box = $('#f' + side);
    box.style.setProperty('--c', c.color);
    box.style.setProperty('--c2', c.color2);
    updateBars(side);
  }

  function updateBars(side) {
    var f = S.fighters[side];
    var pct = Math.max(0, Math.min(100, (f.hp / f.max) * 100));
    $('#hpBar' + side).style.width = pct + '%';
    $('#hpNum' + side).textContent = Math.ceil(f.hp);
    $('#barBox' + side).classList.toggle('low', pct <= 30);
    var spPct = Math.max(0, Math.min(100, f.sp));
    var spBar = $('#spBar' + side);
    spBar.style.width = spPct + '%';
    spBar.classList.toggle('full', f.sp >= 100);
    var spNum = $('#spNum' + side);
    spNum.textContent = f.sp >= 100 ? 'MAX!' : Math.round(f.sp);
  }

  function renderSkills() {
    var side = S.turn;
    var f = S.fighters[side];
    if (!f) return;
    var c = CHARS[f.key];
    $('#icoBasic').textContent = c.basic.emoji;
    $('#nameBasic').textContent = c.basic.name;
    $('#icoSpecial').textContent = c.special.emoji;
    $('#nameSpecial').textContent = c.special.name;
    $('#icoDefend').textContent = c.defend.emoji;
    $('#nameDefend').textContent = c.defend.name;

    var human = S.mode === 'duo' || side === 0;
    var ready = f.sp >= 100;
    $('#btnSpecial').classList.toggle('ready', ready && !S.over);
    $('#subSpecial').textContent = ready ? '지금 쓸 수 있어요! ✨' : '별빛을 가득 채우면!';

    $$('#skills .skill').forEach(function (b) {
      var act = b.dataset.act;
      var dis = !human || S.busy || S.over;
      if (act === 'special' && !ready) dis = true;
      b.disabled = dis;
    });
  }

  function renderAll() {
    renderFighter(0);
    renderFighter(1);
    renderSkills();
    updateProgress();
  }

  function updateProgress() {
    var badge = $('#progressBadge');
    if (S.mode === 'solo') {
      badge.style.display = '';
      badge.textContent = '🏆 ' + S.wins + ' / 3';
    } else {
      badge.style.display = 'none';
    }

  /* =========================================================
     effects
  ========================================================= */
  var fx = null;

  function clearFx() {
    if (fx) fx.innerHTML = '';
  }

  function avatarCenter(side) {
    var stage = $('#stage');
    var sr = stage.getBoundingClientRect();
    var box = $('#av' + side).getBoundingClientRect();
    return { x: box.left + box.width / 2 - sr.left, y: box.top + box.height * 0.48 - sr.top };
  }

  function projectile(fromSide, toSide, emoji, size) {
    var a = avatarCenter(fromSide);
    var b = avatarCenter(toSide);
    var el = document.createElement('div');
    el.className = 'projectile';
    el.textContent = emoji;
    el.style.left = a.x + 'px';
    el.style.top = a.y + 'px';
    el.style.fontSize = (size || 46) + 'px';
    el.style.setProperty('--tx', (b.x - a.x) + 'px');
    el.style.setProperty('--ty', (b.y - a.y) + 'px');
    fx.appendChild(el);
    setTimeout(function () { if (el.parentNode) el.parentNode.removeChild(el); }, 620);
  }

  function burst(side, emojis, count, strong) {
    var p = avatarCenter(side);
    var n = count || 10;
    for (var i = 0; i < n; i += 1) {
      (function (i) {
        var el = document.createElement('div');
        el.className = 'spark';
        el.textContent = emojis[rnd(emojis.length)];
        el.style.left = p.x + 'px';
        el.style.top = p.y + 'px';
        el.style.fontSize = (strong ? 30 + Math.random() * 26 : 20 + Math.random() * 18) + 'px';
        var ang = Math.random() * Math.PI * 2;
        var dist = (strong ? 120 : 76) * (0.45 + Math.random());
        el.style.setProperty('--dx', Math.cos(ang) * dist + 'px');
        el.style.setProperty('--dy', Math.sin(ang) * dist - 24 + 'px');
        el.style.setProperty('--r', (Math.random() * 120 - 60) + 'deg');
        el.style.animationDelay = (i * 28) + 'ms';
        fx.appendChild(el);
        setTimeout(function () { if (el.parentNode) el.parentNode.removeChild(el); }, 1100 + i * 28);
      })(i);
    }
  }

  function ring(side, color, big) {
    var p = avatarCenter(side);
    var el = document.createElement('div');
    el.className = 'ring' + (big ? ' big' : '');
    el.style.left = p.x + 'px';
    el.style.top = p.y + 'px';

  /* =========================================================
     battle logic
  ========================================================= */
  function updateTurn() {
    if (S.over) return;
    var side = S.turn;
    var b = $('#turnBanner');
    $('#f0').classList.toggle('active-turn', side === 0);
    $('#f1').classList.toggle('active-turn', side === 1);

    if (S.mode === 'solo') {
      if (side === 0) {
        b.textContent = '🧒 내 차례! 버튼을 눌러요';
        b.className = 'turn-banner p1';
      } else {
        b.textContent = '🤖 컴퓨터가 고르는 중...';
        b.className = 'turn-banner ai';
      }
    } else {
      b.textContent = side === 0 ? '1️⃣ 1번 친구 차례!' : '2️⃣ 2번 친구 차례!';
      b.className = 'turn-banner p' + (side + 1);
    }
    renderSkills();

    if (S.mode === 'solo' && side === 1) {
      S.aiToken += 1;
      var token = S.aiToken;
      setTimeout(function () {
        if (token === S.aiToken && !S.over && !S.busy && S.turn === 1) aiMove();
      }, 950);
    }
  }

  function aiMove() {
    var f = S.fighters[1];
    var act = 'basic';
    if (f.hp <= f.max * 0.34 && Math.random() < 0.55) {
      act = 'defend';
    } else if (f.sp >= 100) {
      act = Math.random() < 0.8 ? 'special' : 'defend';
    } else if (Math.random() < 0.12) {
      act = 'defend';
    }
    doMove(1, act);
  }

  function doMove(side, action) {
    if (S.over || S.busy) return;
    var me = S.fighters[side];
    var foeSide = 1 - side;
    var c = CHARS[me.key];
    if (action === 'special' && me.sp < 100) { say('별빛이 아직 모자라요 ⭐ 기본 기술로 채워 봐요!'); return; }

    var comboBonus = (action === 'special' && S.defenders[side]);
    S.busy = true;
    S.defenders[side] = (action === 'defend');
    renderSkills();

    var av = $('#av' + side);
    av.classList.remove('cast');
    void av.offsetWidth;
    av.classList.add('cast');
    setTimeout(function () { av.classList.remove('cast'); }, 500);

    if (action === 'basic') {
      SFX.basic();
      say(c.name + '의 ' + c.basic.name + '! ' + c.basic.emoji);
      projectile(side, foeSide, c.basic.emoji, 46);
      me.sp = Math.min(100, me.sp + 26);
      updateBars(side);
      var dmg = 15 + rnd(10);
      setTimeout(function () {
        var done = hit(foeSide, dmg, false);
        if (!done) setTimeout(function () { endTurn(side); }, 520);
      }, 430);
      return;
    }

    if (action === 'special') {
      SFX.special();
      specialBanner('초필살기!');
      flash(c.color);
      say('✨ ' + c.special.name + '! ' + c.special.emoji);
      me.sp = 0;
      updateBars(side);
      [0, 120, 240].forEach(function (delay, i) {
        setTimeout(function () {
          projectile(side, foeSide, c.fx[i % c.fx.length], 54);
        }, delay);
      });
      var sdmg = 33 + rnd(12) + (comboBonus ? 10 : 0);
      setTimeout(function () {
        if (comboBonus) {
          floatNum(foeSide, '🛡️ 콤보 +10!', 'combo');
          SFX.combo();
        }
        var done = hit(foeSide, sdmg, true);
        if (!done) setTimeout(function () { endTurn(side); }, 860);
      }, 500);
      return;
    }

    // defend & heal
    SFX.shield();
    var heal = Math.min(me.max - me.hp, 14);
    me.hp += heal;
    me.shield = true;
    me.sp = Math.min(100, me.sp + 22);
    updateBars(side);
    burst(side, ['🛡️', '✨'], 9, false);
    floatNum(side, '+' + heal + ' ❤️', 'good');
    setTimeout(function () { SFX.heal(); }, 120);
    say('🛡️ ' + c.defend.name + '! 에너지 +' + heal + ', 다음 공격을 막아요');
    setTimeout(function () { endTurn(side); }, 980);
  }

  function hit(side, dmg, big) {
    var f = S.fighters[side];
    var d = dmg;
    var blocked = false;
    if (f.shield) {
      d = Math.max(1, Math.round(dmg * 0.4));
      f.shield = false;
      blocked = true;
    }
    f.hp = Math.max(0, f.hp - d);
    updateBars(side);

    var av = $('#av' + side);
    av.classList.remove('hit');
    void av.offsetWidth;
    av.classList.add('hit');
    setTimeout(function () { av.classList.remove('hit'); }, 620);

    burst(side, (big ? ['⭐', '✨', '💫'] : ['✨', '💫']), big ? 16 : 8, big);
    ring(side, blocked ? '#9DE2BE' : '#FFFFFF', big);
    if (big) { stageShake(); SFX.bigHit(); } else { SFX.hit(); }
    floatNum(side, '-' + d, blocked ? 'good' : 'bad');
    if (blocked) say('🛡️ 방패가 막아 줬어요! 에너지가 조금만 줄었어요');

    if (f.hp <= 0) {
      win(1 - side);
      return true;
    }
    return false;
  }

  function endTurn(side) {
    if (S.over) return;
    S.turn = 1 - side;
    S.busy = false;
    updateTurn();
  }

  function win(w) {
    if (S.over) return;
    S.over = true;
    S.busy = true;
    S.aiToken += 1;

    var winner = S.fighters[w];
    var loser = S.fighters[1 - w];
    var losingSide = 1 - w;

    $('#sleep' + losingSide).classList.add('show');
    $('#f0').classList.remove('active-turn');
    $('#f1').classList.remove('active-turn');
    var b = $('#turnBanner');
    b.textContent = '🏆 ' + CHARS[winner.key].name + ' 승리!';
    b.className = 'turn-banner p' + (w + 1);
    say('🏆 ' + CHARS[winner.key].name + ' 승리! ' + CHARS[loser.key].name + '는 힘이 다 빠져서 낮잠 자러 갔어요 💤');

    SFX.win();
    burst(w, ['🎉', '⭐', '🏆', '✨'], 22, true);
    renderSkills();

    setTimeout(function () { afterWin(w); }, 1300);
  }

  function afterWin(w) {
    if (S.mode === 'duo') {
      showEnd(w);
      return;
    }
    if (w === 1) {
      SFX.lose();
      showRoundOver();
      return;
    }
    S.wins += 1;
    updateProgress();
    if (S.wins >= 3) {
      showEnd(0);
      return;
    }
    SFX.round();
    showRoundNext();
  }

  /* =========================================================
     flow — solo ladder / duo
  ========================================================= */
  function mkFighters(a, b, bMax) {
    S.fighters = [mk(a, 100), mk(b, bMax || 100)];
  }

  function freshBattle(openerText) {
    S.turn = 0;
    S.busy = false;
    S.over = false;
    S.aiToken += 1;
    S.defenders = [false, false];
    $('#ovRound').classList.remove('show');
    $('#ovEnd').classList.remove('show');
    $('#sleep0').classList.remove('show');
    $('#sleep1').classList.remove('show');
    clearRemoveConfetti();
    clearFx();
    showScreen('screen-battle');
    renderAll();
    say(openerText || '버튼을 눌러 기술을 써요!');
    updateTurn();
  }

  function beginSolo(heroKey) {
    S.mode = 'solo';
    S.hero = heroKey;
    S.wins = 0;
    S.lineup = shuffle(ORDER.filter(function (k) { return k !== heroKey; })).slice(0, 3);
    startRound();
  }

  function startRound() {
    var idx = Math.min(S.wins, 2);
    var oppKey = S.lineup[idx];
    var oppMax = 100 + idx * 10;
    mkFighters(S.hero, oppKey, oppMax);
    freshBattle('⭐ ' + (idx + 1) + '번째 도전! 상대는 ' + CHARS[oppKey].name + ' ' + CHARS[oppKey].emoji);
  }

  function beginDuo(a, b) {
    S.mode = 'duo';
    S.picks = [a, b];
    S.wins = 0;
    mkFighters(a, b, 100);
    freshBattle('1번 친구부터 시작! 버튼을 눌러요 🧒');
  }

  function retryRound() {
    var idx = Math.min(S.wins, 2);
    var oppKey = S.lineup[idx];
    var oppMax = 100 + idx * 10;
    mkFighters(S.hero, oppKey, oppMax);
    freshBattle('다시 도전! ⭐ ' + (idx + 1) + '번째 상대 ' + CHARS[oppKey].name);
  }

  /* =========================================================
     overlays
  ========================================================= */
  function starRow(n) {
    var out = '';
    for (var i = 0; i < 3; i += 1) {
      out += '<span class="' + (i < n ? 'on' : 'off') + '" style="animation-delay:' + (i * 0.12) + 's">⭐</span>';
    }
    return out;
  }

  function showRoundNext() {
    S.roundMode = 'next';
    var beaten = S.lineup[S.wins - 1];
    var next = S.lineup[S.wins];
    $('#roundIcon').textContent = '🎉';
    $('#roundTitle').textContent = CHARS[beaten].name + '을(를) 이겼어요!';
    $('#roundStars').innerHTML = starRow(S.wins);
    $('#roundDesc').innerHTML = '⭐ ' + S.wins + '승! 다음 상대는 <b>' + CHARS[next].name + '</b> ' + CHARS[next].emoji + '<br><span class="mini">에너지를 가득 채우고 시작해요</span>';
    $('#roundBtn').textContent = '계속 도전! ⚡';
    $('#ovRound').classList.add('show');
    confettiShow(24);
  }

  function showRoundOver() {
    S.roundMode = 'retry';
    var opp = S.lineup[Math.min(S.wins, 2)];
    $('#roundIcon').textContent = '😴';
    $('#roundTitle').textContent = '힘이 다 빠졌어요 💤';
    $('#roundStars').innerHTML = starRow(S.wins);
    $('#roundDesc').innerHTML = CHARS[opp].name + '가 아직 기다리고 있어요.<br><span class="mini">다시 도전하면 에너지가 가득 채워져요</span>';
    $('#roundBtn').textContent = '다시 도전! 🔄';
    $('#ovRound').classList.add('show');
  }

  function showEnd(w) {
    var champion = (S.mode === 'solo' && w === 0 && S.wins >= 3);
    var winner = S.fighters[w];
    var loser = S.fighters[1 - w];

    if (champion) {
      $('#endIcon').textContent = '🏆';
      $('#endTitle').textContent = '3연승 챔피언!';
      $('#endDesc').innerHTML = CHARS[winner.key].name + '가 세 번 모두 이겼어요!<br><span class="mini">정말 대단해요. 다음엔 다른 영웅으로도 도전해 봐요!</span>';
    } else {
      $('#endIcon').textContent = w === 0 ? '🏆' : '🌙';
      $('#endTitle').textContent = CHARS[winner.key].name + ' 승리!';
      $('#endDesc').innerHTML = CHARS[loser.key].name + '는 힘이 다 빠져서 낮잠 자러 갔어요 💤<br><span class="mini">' + (S.mode === 'duo' ? '둘 다 정말 멋졌어요!' : '한 번 더 하면 이길 수 있어요!') + '</span>';
    }
    $('#ovEnd').classList.add('show');
    confettiShow(56);
    SFX.win();
  }

  /* =========================================================
     confetti
  ========================================================= */
  var confettiTimer = null;

  function confettiShow(count) {
    var host = $('#confetti');
    host.innerHTML = '';
    var palette = ['#FF6B8B', '#FFC83D', '#5B8CFF', '#8F79FF', '#48D597', '#FF9F1C', '#FF7AD9'];
    var emojis = ['🎉', '⭐', '✨', '🎈', '💛', '🏆', '🌟'];
    for (var i = 0; i < count; i += 1) {
      var el = document.createElement('span');
      var useEmoji = Math.random() < 0.32;
      if (useEmoji) {
        el.textContent = emojis[rnd(emojis.length)];
        el.style.fontSize = (16 + Math.random() * 22) + 'px';
      } else {
        var w = 9 + Math.random() * 12;
        el.style.width = w + 'px';
        el.style.height = (w * (Math.random() < 0.5 ? 1 : 0.55)) + 'px';
        el.style.background = palette[rnd(palette.length)];
        el.style.borderRadius = Math.random() < 0.4 ? '50%' : '3px';
      }
      el.style.left = (Math.random() * 100) + '%';
      el.style.animationDuration = (2.4 + Math.random() * 2.2) + 's';
      el.style.animationDelay = (Math.random() * 1.4) + 's';
      host.appendChild(el);
    }
    if (confettiTimer) clearTimeout(confettiTimer);
    confettiTimer = setTimeout(clearRemoveConfetti, 6000);
  }

  function clearRemoveConfetti() {
    var host = $('#confetti');
    if (host) host.innerHTML = '';
  }

  /* =========================================================
     setup screens
  ========================================================= */
  var pickStep = 0;   // 0 = none, 1 = first picker, 2 = second picker

  function buildHeroRow() {
    var row = $('#heroRow');
    row.innerHTML = '';
    ['zeus', 'pikachu', 'ironman'].forEach(function (k) {
      var d = document.createElement('div');
      d.className = 'peek';
      d.innerHTML = paint(CHARS[k].svg);
      row.appendChild(d);
    });
  }

  function renderPick() {
    var grid = $('#pickGrid');
    grid.innerHTML = '';
    ORDER.forEach(function (key) {
      var c = CHARS[key];
      var b = document.createElement('button');
      b.className = 'pick-card world-' + c.wkey;
      b.dataset.key = key;
      b.innerHTML = '<div class="pick-art">' + paint(c.svg) + '</div>' +
        '<div class="pick-txt"><div class="pick-name">' + c.name + '</div>' +
        '<div class="pick-tag">' + c.wlabel + ' · ' + c.emoji + '</div></div>';
      if (S.picks.indexOf(key) !== -1) b.classList.add('picked');
      b.addEventListener('click', function () { pickChar(key); });
      grid.appendChild(b);
    });
  }

  function showModeStep() {
    $('#modeWrap').style.display = '';
    $('#pickWrap').classList.remove('show');
    $('#setupTitle').textContent = '누구랑 놀까요?';
    pickStep = 0;
  }

  function chooseMode(mode) {
    SFX.click();
    S.mode = mode;
    S.picks = [];
    S.wins = 0;
    pickStep = 1;
    $('#modeWrap').style.display = 'none';
    $('#pickWrap').classList.add('show');
    if (mode === 'solo') {
      $('#setupTitle').textContent = '나의 영웅을 골라요!';
      $('#pickHint').innerHTML = '<b>1개만 콕!</b> 컴퓨터가 다른 영웅들을 차례로 도전해 와요';
    } else {
      $('#setupTitle').textContent = '둘이서 영웅을 골라요!';
      $('#pickHint').innerHTML = '<b>1번 친구</b>의 영웅을 골라 주세요';
    }
    renderPick();
  }

  function pickChar(key) {
    SFX.click();
    if (S.mode === 'solo') {
      beginSolo(key);
      return;
    }
    if (pickStep === 1) {
      S.picks = [key];
      pickStep = 2;
      $('#pickHint').innerHTML = '<b>2번 친구</b>의 영웅을 골라 주세요 (1번: ' + CHARS[key].name + ')';
      renderPick();
      return;
    }
    if (pickStep === 2) {
      var first = S.picks[0];
      beginDuo(first, key);
    }
  }

  /* =========================================================
     wiring
  ========================================================= */
  function init() {
    fx = $('#fx');
    buildHeroRow();
    renderPick();
    applySoundUI();

    $('#startBtn').addEventListener('click', function () {
      SFX.click();
      audio();
      showModeStep();
      showScreen('screen-setup');
    });

    $$('.mode-card').forEach(function (b) {
      b.addEventListener('click', function () { chooseMode(b.dataset.mode); });
    });

    $('#backBtn').addEventListener('click', function () {
      SFX.click();
      if ($('#pickWrap').classList.contains('show')) {
        showModeStep();
      } else {
        showScreen('screen-start');
      }
    });

    $('#pickBack').addEventListener('click', function () {
      SFX.click();
      S.picks = [];
      showModeStep();
    });

    ['#soundBtn', '#soundBtn2'].forEach(function (sel) {
      var b = $(sel);
      if (b) b.addEventListener('click', function () { toggleSound(); });
    });

    $('#homeBtn').addEventListener('click', function () {
      SFX.click();
      S.over = true;
      S.aiToken += 1;
      clearRemoveConfetti();
      clearFx();
      showScreen('screen-start');
    });

    $('#skills').addEventListener('click', function (ev) {
      var b = ev.target.closest ? ev.target.closest('.skill') : null;
      if (!b || b.disabled) return;
      if (S.over || S.busy) return;
      var human = S.mode === 'duo' || S.turn === 0;
      if (!human) return;
      doMove(S.turn, b.dataset.act);
    });

    $('#roundBtn').addEventListener('click', function () {
      SFX.click();
      $('#ovRound').classList.remove('show');
      clearRemoveConfetti();
      if (S.roundMode === 'next') startRound();
      else retryRound();
    });

    $('#againBtn').addEventListener('click', function () {
      SFX.click();
      $('#ovEnd').classList.remove('show');
      clearRemoveConfetti();
      if (S.mode === 'duo') beginDuo(S.picks[0], S.picks[1]);
      else beginSolo(S.hero);
    });

    $('#changeBtn').addEventListener('click', function () {
      SFX.click();
      $('#ovEnd').classList.remove('show');
      clearRemoveConfetti();
      S.over = true;
      S.aiToken += 1;
      S.picks = [];
      showModeStep();
      showScreen('screen-setup');
    });

    document.addEventListener('keydown', function (e) {
      if (e.key === 'Enter' && $('#screen-start').classList.contains('active')) {
        e.preventDefault();
        $('#startBtn').click();
        return;
      }
      var map = { '1': 'basic', '2': 'special', '3': 'defend' };
      if (map[e.key]) {
        var b = $('#skills .skill[data-act="' + map[e.key] + '"]');
        if (b && !b.disabled) {
          e.preventDefault();
          b.click();
        }
      }
    });

    window.KaiGame = { CHARS: CHARS, state: S, start: beginSolo, render: renderAll, turn: updateTurn };
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', init);
  } else {
    init();
  }
})();
</script>
</body>
</html>
